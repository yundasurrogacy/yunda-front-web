<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#271f18" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Decorative frame -->
  <rect x="24" y="30" width="1152" height="220" rx="28" fill="#FAF7F2" stroke="#BFC9BF" stroke-width="2"/>
  <rect x="24" y="30" width="1152" height="56" rx="28" fill="#FBF0DA"/>
  <rect x="24" y="86" width="1152" height="1.5" fill="#BFC9BF" opacity="0.55"/>

  <!-- Connector line -->
  <path d="M120 162H1080" stroke="#BFC9BF" stroke-width="8" stroke-linecap="round" opacity="0.65"/>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <!-- 1 Meds -->
    <g transform="translate(120 162)">
      <circle r="46" fill="#FBF0DA" stroke="#A96C42" stroke-width="4"/>
      <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#A96C42" opacity="0.18"/>
      <path d="M-16 0H16" stroke="#A96C42" stroke-width="4" stroke-linecap="round"/>
      <path d="M-8 -12C-18 -12 -18 -2 -8 -2H8C18 -2 18 -12 8 -12H-8Z" fill="#A96C42" opacity="0.18"/>
      <path d="M-8 2C-18 2 -18 12 -8 12H8C18 12 18 2 8 2H-8Z" fill="#A96C42" opacity="0.18"/>
    </g>

    <!-- 2 Transfer -->
    <g transform="translate(360 162)">
      <circle r="46" fill="#FBF0DA" stroke="#A96C42" stroke-width="4"/>
      <path d="M-18 -8H8" stroke="#A96C42" stroke-width="5" stroke-linecap="round"/>
      <path d="M4 -18L22 0L4 18" stroke="#A96C42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-18" cy="-8" r="4.5" fill="#A96C42"/>
    </g>

    <!-- 3 Heartbeat -->
    <g transform="translate(600 162)">
      <circle r="46" fill="#FBF0DA" stroke="#A96C42" stroke-width="4"/>
      <path
        d="M0 20C-18 8 -30 -2 -30 -16C-30 -26 -22 -34 -12 -34C-6 -34 -2 -31 0 -28C2 -31 6 -34 12 -34C22 -34 30 -26 30 -16C30 -2 18 8 0 20Z"
        fill="#A96C42"
        opacity="0.30"
      />
      <path d="M-24 0H-10L-4 -10L6 14L12 0H24" stroke="#A96C42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 4 Pregnancy -->
    <g transform="translate(840 162)">
      <circle r="46" fill="#FBF0DA" stroke="#A96C42" stroke-width="4"/>
      <rect x="-20" y="-18" width="40" height="34" rx="8" fill="#A96C42" opacity="0.18"/>
      <path d="M-20 -6H20" stroke="#A96C42" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      <path d="M-10 -22V-14" stroke="#A96C42" stroke-width="4" stroke-linecap="round"/>
      <path d="M10 -22V-14" stroke="#A96C42" stroke-width="4" stroke-linecap="round"/>
      <path d="M-10 4H10" stroke="#A96C42" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 5 Delivery -->
    <g transform="translate(1080 162)">
      <circle r="46" fill="#FBF0DA" stroke="#A96C42" stroke-width="4"/>
      <circle cx="0" cy="-2" r="18" fill="#A96C42" opacity="0.18"/>
      <circle cx="-6" cy="-6" r="3.5" fill="#A96C42"/>
      <circle cx="6" cy="-6" r="3.5" fill="#A96C42"/>
      <path d="M-6 6C-2 10 2 10 6 6" stroke="#A96C42" stroke-width="4" stroke-linecap="round"/>
      <path d="M-18 18C-6 8 6 8 18 18" stroke="#A96C42" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
